name: Hardware Schematic Check

on:
  push:
    paths:
      - "hardware/kicad/enku-mainboard-r0.1/**"
      - ".github/workflows/hardware-schematic-check.yml"
  pull_request:
    paths:
      - "hardware/kicad/enku-mainboard-r0.1/**"
      - ".github/workflows/hardware-schematic-check.yml"

permissions:
  contents: read

jobs:
  schematic-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate ENKU R0.1 schematics
        run: python hardware/kicad/enku-mainboard-r0.1/check_schematics.py
