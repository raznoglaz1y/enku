name: Hardware Zone Fill Artifact

on:
  push:
    paths:
      - "hardware/kicad/enku-mainboard-r0.1/**"
      - ".github/workflows/hardware-zone-fill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill-zones:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Fill copper zones with KiCad
        run: |
          python3 - <<'PY'
          import pcbnew
          src="hardware/kicad/enku-mainboard-r0.1/enku-mainboard-r0.1.kicad_pcb"
          out="/tmp/enku-mainboard-r0.1-filled.kicad_pcb"
          board=pcbnew.LoadBoard(src)
          filler=pcbnew.ZONE_FILLER(board)
          filler.Fill(board.Zones())
          pcbnew.SaveBoard(out, board)
          print("filled_zones=", board.GetAreaCount())
          PY
      - name: Verify filled board
        run: |
          kicad-cli pcb drc --severity-all --schematic-parity --all-track-errors --output /tmp/filled-drc.rpt /tmp/enku-mainboard-r0.1-filled.kicad_pcb
          cat /tmp/filled-drc.rpt
      - name: Persist filled copper
        run: |
          target="hardware/kicad/enku-mainboard-r0.1/enku-mainboard-r0.1.kicad_pcb"
          cp /tmp/enku-mainboard-r0.1-filled.kicad_pcb "$target"
          if git diff --quiet -- "$target"; then
            echo "Filled copper already persisted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "pcb: persist filled ground pours"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enku-r01-filled-board
          path: |
            /tmp/enku-mainboard-r0.1-filled.kicad_pcb
            /tmp/filled-drc.rpt
