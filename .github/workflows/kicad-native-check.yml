name: Native KiCad Check

on:
  push:
    paths:
      - "hardware/kicad/enku-mainboard-r0.1/**"
      - ".github/workflows/kicad-native-check.yml"
  pull_request:
    paths:
      - "hardware/kicad/enku-mainboard-r0.1/**"
      - ".github/workflows/kicad-native-check.yml"

permissions:
  contents: read

jobs:
  kicad-native:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:8.0
      options: --user 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: KiCad version
        run: kicad-cli version

      - name: Native schematic ERC parse
        run: |
          kicad-cli sch erc             --output /tmp/enku-r01-erc.rpt             hardware/kicad/enku-mainboard-r0.1/enku-mainboard-r0.1.kicad_sch
          cat /tmp/enku-r01-erc.rpt

      - name: Native PCB DRC parse
        run: |
          kicad-cli pcb drc             --output /tmp/enku-r01-drc.rpt             hardware/kicad/enku-mainboard-r0.1/enku-mainboard-r0.1.kicad_pcb
          cat /tmp/enku-r01-drc.rpt

      - name: Gate first-spin critical violations
        run: |
          failed=0

          if grep -E '^\[(pin_to_pin|power_pin_not_driven|lib_symbol_issues|pin_not_connected|label_dangling|global_label_dangling)\]:' /tmp/enku-r01-erc.rpt; then
            echo "Critical schematic ERC violation detected."
            failed=1
          fi

          if grep -E '^\[(shorting_items|clearance|hole_clearance)\]:' /tmp/enku-r01-drc.rpt; then
            echo "Critical PCB copper/clearance violation detected."
            failed=1
          fi

          exit "$failed"

      - name: Export native schematic netlist
        run: |
          kicad-cli sch export netlist \
            --output /tmp/enku-r01.net \
            hardware/kicad/enku-mainboard-r0.1/enku-mainboard-r0.1.kicad_sch
          test -s /tmp/enku-r01.net
          echo "Netlist components: $(grep -c '<comp ref=' /tmp/enku-r01.net || true)"

      - name: Preserve KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enku-r01-kicad-reports
          path: |
            /tmp/enku-r01-erc.rpt
            /tmp/enku-r01-drc.rpt
            /tmp/enku-r01.net
          if-no-files-found: warn
