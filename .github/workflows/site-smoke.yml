name: Website smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/site-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 45

      - name: Check public pages
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 10 https://enkureader.com/contact -o /tmp/contact.html
          grep -q 'id="contact-form"' /tmp/contact.html
          grep -q "fetch('/api/contact'" /tmp/contact.html
          curl -fsSL --retry 5 --retry-delay 10 https://enkureader.com/software -o /tmp/software.html
          grep -q '<title>Software — ENKU</title>' /tmp/software.html
          grep -q 'href="/software" class="active"' /tmp/software.html
          curl -fsSL --retry 5 --retry-delay 10 https://enkureader.com/ -o /tmp/home.html
          grep -q 'href="/software">Software</a>' /tmp/home.html

      - name: Check contact Worker route
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/contact-api.txt -w '%{http_code}' https://enkureader.com/api/contact)"
          cat /tmp/contact-api.txt
          test "$code" = "405"
          grep -q '"error":"Method not allowed"' /tmp/contact-api.txt
