name: Website smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/site-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed site revision
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            echo "Deployment check $attempt/24"

            contact_ok=0
            software_ok=0
            design_ok=0
            build_ok=0
            home_ok=0

            if curl -fsSL https://enkureader.com/contact -o /tmp/contact.html &&
               grep -q 'id="contact-form"' /tmp/contact.html &&
               grep -q "fetch('/api/contact'" /tmp/contact.html; then
              contact_ok=1
            fi

            if curl -fsSL https://enkureader.com/software -o /tmp/software.html &&
               grep -q '<title>Software — ENKU</title>' /tmp/software.html &&
               grep -q 'href="/software" class="active"' /tmp/software.html; then
              software_ok=1
            fi

            if curl -fsSL https://enkureader.com/design -o /tmp/design.html &&
               grep -q '<title>Design — ENKU</title>' /tmp/design.html &&
               grep -q 'href="/design" class="active"' /tmp/design.html; then
              design_ok=1
            fi

            if curl -fsSL https://enkureader.com/build -o /tmp/build.html &&
               grep -q '<title>Build — ENKU</title>' /tmp/build.html &&
               grep -q 'href="/build" class="active"' /tmp/build.html; then
              build_ok=1
            fi

            home_nav=0
            home_hub=0
            home_footer=0
            home_legacy=0

            if curl -fsSL https://enkureader.com/ -o /tmp/home.html; then
              if grep -Eq 'href="/software"[^>]*>Software</a>' /tmp/home.html &&
                 grep -Eq 'href="/hardware"[^>]*>Hardware</a>' /tmp/home.html &&
                 grep -Eq 'href="/design"[^>]*>Design</a>' /tmp/home.html &&
                 grep -Eq 'href="/build"[^>]*>Build</a>' /tmp/home.html &&
                 grep -q 'class="project-menu"' /tmp/home.html; then
                home_nav=1
              fi

              if grep -q 'class="enku-home"' /tmp/home.html &&
                 grep -q 'One reader. Four connected layers.' /tmp/home.html; then
                home_hub=1
              fi

              if grep -Eq 'class="[^"]*enku-footer-grid[^"]*"' /tmp/home.html; then
                home_footer=1
              fi

              if ! grep -q 'href="/#hardware"' /tmp/home.html &&
                 ! grep -q 'href="/#software"' /tmp/home.html &&
                 ! grep -q 'href="/#design"' /tmp/home.html &&
                 ! grep -q 'href="/#build"' /tmp/home.html; then
                home_legacy=1
              fi
            fi

            if [ "$home_nav" = 1 ] &&
               [ "$home_hub" = 1 ] &&
               [ "$home_footer" = 1 ] &&
               [ "$home_legacy" = 1 ]; then
              home_ok=1
            fi

            if [ "$contact_ok" = 1 ] &&
               [ "$software_ok" = 1 ] &&
               [ "$design_ok" = 1 ] &&
               [ "$build_ok" = 1 ] &&
               [ "$home_ok" = 1 ]; then
              echo "Expected site revision is live."
              exit 0
            fi

            echo "contact=$contact_ok software=$software_ok design=$design_ok build=$build_ok home=$home_ok nav=$home_nav hub=$home_hub footer=$home_footer legacy=$home_legacy"
            sleep 10
          done

          echo "Timed out waiting for expected Cloudflare deployment after ~4 minutes."
          exit 1

      - name: Check public pages
        run: |
          set -euo pipefail
          grep -q 'id="contact-form"' /tmp/contact.html
          grep -q "fetch('/api/contact'" /tmp/contact.html
          grep -q '<title>Software — ENKU</title>' /tmp/software.html
          grep -q 'href="/software" class="active"' /tmp/software.html
          grep -q '<title>Design — ENKU</title>' /tmp/design.html
          grep -q 'href="/design" class="active"' /tmp/design.html
          grep -q '<title>Build — ENKU</title>' /tmp/build.html
          grep -q 'href="/build" class="active"' /tmp/build.html
          grep -q 'class="enku-next"' /tmp/build.html
          grep -q 'href="/status"' /tmp/build.html
          curl -fsSL https://enkureader.com/status -o /tmp/status.html
          grep -q '<summary class="active">Project' /tmp/status.html
          ! grep -q '<details class="project-menu" open' /tmp/status.html
          grep -q 'id="enku-project-system"' /tmp/status.html

          curl -fsSL https://enkureader.com/about -o /tmp/about.html
          grep -q '<title>About — ENKU</title>' /tmp/about.html
          grep -q 'id="enku-project-system"' /tmp/about.html
          grep -q 'class="enku-next"' /tmp/about.html

          curl -fsSL https://enkureader.com/build-log -o /tmp/log.html
          grep -q '<title>Build Log — ENKU</title>' /tmp/log.html
          grep -q 'id="enku-project-system"' /tmp/log.html
          grep -q 'class="enku-next"' /tmp/log.html

          curl -fsSL https://enkureader.com/downloads -o /tmp/downloads.html
          grep -q '<title>Downloads — ENKU</title>' /tmp/downloads.html
          grep -q 'id="enku-project-system"' /tmp/downloads.html
          grep -q 'class="enku-next"' /tmp/downloads.html

          curl -fsSL https://enkureader.com/contact -o /tmp/contact-project.html
          grep -q 'id="enku-project-system"' /tmp/contact-project.html
          grep -q 'class="enku-next"' /tmp/contact-project.html
          grep -Eq 'href="/software"[^>]*>Software</a>' /tmp/home.html
          grep -Eq 'href="/hardware"[^>]*>Hardware</a>' /tmp/home.html
          grep -Eq 'href="/design"[^>]*>Design</a>' /tmp/home.html
          grep -Eq 'href="/build"[^>]*>Build</a>' /tmp/home.html
          grep -q 'class="project-menu"' /tmp/home.html
          grep -q 'class="enku-home"' /tmp/home.html
          grep -q 'class="enku-home-render"' /tmp/home.html
          grep -q 'src="/assets/enku-reader-approved.webp"' /tmp/home.html
          grep -q 'class="project-chevron"' /tmp/home.html
          grep -q 'One reader. Four connected layers.' /tmp/home.html
          grep -Eq 'class="[^"]*enku-footer-grid[^"]*"' /tmp/home.html
          ! grep -q 'href="/#hardware"' /tmp/home.html
          ! grep -q 'href="/#software"' /tmp/home.html
          ! grep -q 'href="/#design"' /tmp/home.html
          ! grep -q 'href="/#build"' /tmp/home.html

      - name: Check contact Worker route
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/contact-api.txt -w '%{http_code}' https://enkureader.com/api/contact)"
          cat /tmp/contact-api.txt
          test "$code" = "405"
          grep -q '"error":"Method not allowed"' /tmp/contact-api.txt
