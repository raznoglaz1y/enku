<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1040" viewBox="0 0 1360 1040">
<style>
  text{font-family:"Noto Sans",Arial,sans-serif;fill:#111}
  .h1{font-size:34px;font-weight:700}.sub{font-size:16px}.label{font-size:18px;font-weight:700}
  .screenTitle{font-size:22px;font-weight:700}.body{font-size:17px}.meta{font-size:13px}
  .small{font-size:12px}.row{fill:#fff;stroke:#111;stroke-width:1}.focus{fill:#fff;stroke:#111;stroke-width:3}
  .btn{fill:#111}.btnt{fill:#fff;font-size:17px;font-weight:700}.bg{fill:#efefec}.panel{fill:#fff}
</style>
<rect class="bg" width="1360" height="1040"/>
<text class="h1" x="32" y="52">ENKU / First start · Language — EN v2</text>
<text class="sub" x="32" y="86">Canonical EN board · step 1 of 3 · 7-language list · focus ≠ selected</text>
<text class="label" x="32" y="132">Landscape · 800 × 480</text>
<text class="label" x="862" y="132">Portrait · 480 × 800</text>

<!-- landscape -->
<g transform="translate(32,150)">
<rect class="panel" width="800" height="480"/>
<text class="body" x="24" y="30">ENKU</text>
<text class="small" x="700" y="30">1 / 3</text>
<text class="screenTitle" x="24" y="76">Choose interface language</text>

<!-- rows -->
<g transform="translate(16,100)">
<rect class="focus" width="368" height="52" rx="4"/><text class="body" x="18" y="31">English</text><text class="meta" x="250" y="31">English</text><text class="body" x="338" y="31">✓</text>
<g transform="translate(392,0)"><rect class="row" width="368" height="52" rx="4"/><text class="body" x="18" y="31">Русский</text><text class="meta" x="250" y="31">Russian</text></g>
<g transform="translate(0,60)"><rect class="row" width="368" height="52" rx="4"/><text class="body" x="18" y="31">Polski</text><text class="meta" x="250" y="31">Polish</text></g>
<g transform="translate(392,60)"><rect class="row" width="368" height="52" rx="4"/><text class="body" x="18" y="31">Deutsch</text><text class="meta" x="250" y="31">German</text></g>
<g transform="translate(0,120)"><rect class="row" width="368" height="52" rx="4"/><text class="body" x="18" y="31">Français</text><text class="meta" x="250" y="31">French</text></g>
<g transform="translate(392,120)"><rect class="row" width="368" height="52" rx="4"/><text class="body" x="18" y="31">Español</text><text class="meta" x="250" y="31">Spanish</text></g>
<g transform="translate(0,180)"><rect class="row" width="368" height="52" rx="4"/><text class="body" x="18" y="31">Italiano</text><text class="meta" x="250" y="31">Italian</text></g>
</g>
<rect class="btn" x="24" y="360" width="752" height="48" rx="4"/><text class="btnt" x="400" y="391" text-anchor="middle">Continue</text>
<text class="small" x="24" y="448">Navigate — move focus · Confirm — select · Back — previous step</text>
</g>

<!-- portrait -->
<g transform="translate(862,150)">
<rect class="panel" width="480" height="800"/>
<text class="body" x="24" y="30">ENKU</text><text class="small" x="410" y="30">1 / 3</text>
<text class="screenTitle" x="24" y="76">Choose interface language</text>
<g transform="translate(16,100)">
<rect class="focus" width="448" height="52" rx="4"/><text class="body" x="18" y="31">English</text><text class="meta" x="322" y="31">English</text><text class="body" x="418" y="31">✓</text>
<g transform="translate(0,60)"><rect class="row" width="448" height="52" rx="4"/><text class="body" x="18" y="31">Русский</text><text class="meta" x="322" y="31">Russian</text></g>
<g transform="translate(0,120)"><rect class="row" width="448" height="52" rx="4"/><text class="body" x="18" y="31">Polski</text><text class="meta" x="322" y="31">Polish</text></g>
<g transform="translate(0,180)"><rect class="row" width="448" height="52" rx="4"/><text class="body" x="18" y="31">Deutsch</text><text class="meta" x="322" y="31">German</text></g>
<g transform="translate(0,240)"><rect class="row" width="448" height="52" rx="4"/><text class="body" x="18" y="31">Français</text><text class="meta" x="322" y="31">French</text></g>
<g transform="translate(0,300)"><rect class="row" width="448" height="52" rx="4"/><text class="body" x="18" y="31">Español</text><text class="meta" x="322" y="31">Spanish</text></g>
<g transform="translate(0,360)"><rect class="row" width="448" height="52" rx="4"/><text class="body" x="18" y="31">Italiano</text><text class="meta" x="322" y="31">Italian</text></g>
</g>
<rect class="btn" x="24" y="636" width="432" height="48" rx="4"/><text class="btnt" x="240" y="667" text-anchor="middle">Continue</text>
<text class="small" x="24" y="758">Language can be changed later in Settings.</text>
</g>

<text class="label" x="32" y="678">Behavior</text>
<text class="sub" x="32" y="712">• English is the source/reference language. The user may select any supported language on first start.</text>
<text class="sub" x="32" y="742">• Focus outline and selected checkmark are independent states.</text>
<text class="sub" x="32" y="772">• Portrait list is scrollable when more languages are added later.</text>
<text class="sub" x="32" y="802">• Step 2 opens Orientation. Incomplete setup resumes from the saved step.</text>
<!-- Primary CTA: full content width, 24 px horizontal insets in both orientations. -->
</svg>