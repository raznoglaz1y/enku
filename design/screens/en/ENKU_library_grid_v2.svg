<text class="label" x="32" y="682">Behavior</text>
<text class="sub" x="32" y="716">• 2 px outline marks the focused book; reading state/progress remains separate.</text>
<text class="sub" x="32" y="746">• Grid/List, filter, sort and focused/visible book persist across orientation changes.</text>
<text class="sub" x="32" y="776">• Confirm opens the focused book. Menu opens Book Details / actions without losing Library position.</text>
</svg>