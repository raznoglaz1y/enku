<text class="label" x="32" y="682">Behavior</text>
<text class="sub" x="32" y="716">• Entire row is focusable. The outline is focus; book state/progress is persistent data.</text>
<text class="sub" x="32" y="746">• Focus order: books first; header actions are reached through the defined navigation route, not by accidental geometry.</text>
<text class="sub" x="32" y="776">• Long titles use up to 2 lines in production, then ellipsis; metadata remains one line.</text>
</svg>