<g transform="translate(0,172)"><rect class="cover" x="12" y="12" width="38" height="50"/><text class="label" x="66" y="30">Around the World in Eighty Days</text><text class="meta" x="66" y="51">Jules Verne</text><text class="meta" x="320" y="40">Finished ✓</text></g>
