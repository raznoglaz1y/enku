<g transform="translate(0,234)"><rect class="cover" x="10" y="10" width="36" height="48"/><text class="label" x="62" y="28">The Mysterious Island</text><text class="meta" x="62" y="49">Jules Verne</text><text class="meta" x="612" y="36">New</text></g>
</g>
</g>
