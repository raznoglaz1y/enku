.h1{font-size:34px;font-weight:700}.sub{font-size:16px}.label{font-size:18px;font-weight:700}
.title{font-size:22px;font-weight:700}.body{font-size:17px}.meta{font-size:13px}.small{font-size:12px}
.bg{fill:#efefec}.panel{fill:#fff}.row{fill:#fff;stroke:#111;stroke-width:1}.focus{fill:#fff;stroke:#111;stroke-width:3}
.btn{fill:#111}.btnt{fill:#fff;font-size:17px;font-weight:700}.outline{fill:#fff;stroke:#111;stroke-width:1}
.cover{fill:#fff;stroke:#111;stroke-width:1}.bar{fill:#111}.hair{stroke:#111;stroke-width:1}
</style>
<rect class="bg" width="1360" height="1040"/>
<text class="h1" x="32" y="52">ENKU / Library Search — EN v2</text>
<text class="sub" x="32" y="86">Shared keyboard subsystem · global title + author search · explicit focus traversal</text>
<text class="label" x="32" y="132">Landscape · 800 × 480</text><text class="label" x="862" y="132">Portrait · 480 × 800</text>
