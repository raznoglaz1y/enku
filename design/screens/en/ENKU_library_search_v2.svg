<text class="label" x="32" y="682">Behavior</text>
<text class="sub" x="32" y="716">• Search is global across title + author; Library filter does not constrain results.</text>
<text class="sub" x="32" y="746">• Focus order is explicit: query field → results → keyboard → back route. Keyboard layout is independent from UI language.</text>
<text class="sub" x="32" y="776">• Empty query shows the full Library; no-result state uses the dedicated recovery screen.</text>
</svg>