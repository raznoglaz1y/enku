<text class="section" x="32" y="682">Behavior</text><text class="sub" x="32" y="716">• The warning flow is approved, but no fake “10%” threshold is committed.</text>
<text class="sub" x="32" y="746">• Thresholds and battery percentage require measurement/calibration with the actual LP505060 pack.</text>
<text class="sub" x="32" y="776">• Critical battery behavior saves state first; exact shutdown cutoff is a hardware test result.</text>
