<text class="section" x="32" y="682">Behavior</text>
<text class="sub" x="32" y="716">• Activating the query field opens the shared on-screen keyboard; keyboard language is independent from UI language.</text>
<text class="sub" x="32" y="746">• The pre-search reading position is preserved until a result is explicitly opened.</text>
<text class="sub" x="32" y="776">• Result highlighting uses bold + underline, not grayscale alone. Large result sets are loaded in batches.</text>
