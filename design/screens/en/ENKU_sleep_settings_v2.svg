<text class="section" x="32" y="682">Behavior</text><text class="sub" x="32" y="716">• Sleep screens are static: no clock, Wi‑Fi or periodic refresh.</text>
<text class="sub" x="32" y="746">• Any user action restarts the inactivity timer; active writes/transfers suspend it.</text>
<text class="sub" x="32" y="776">• Exact timeout options and wake mapping remain subject to hardware verification.</text>
