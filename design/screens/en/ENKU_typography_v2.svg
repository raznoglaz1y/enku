<text class="section" x="32" y="682">Control model</text>
<text class="sub" x="32" y="716">• Confirm on a preset applies that preset. Manual +/- or alignment changes set the active preset to Custom.</text>
<text class="sub" x="32" y="746">• Proposed test ranges: font 16–30 px (2 px), line spacing 1.10–1.60 (0.05), margins 16–56 px (4 px).</text>
<text class="sub" x="32" y="776">• These numerical ranges remain firmware constants pending real 3.97-inch panel readability testing.</text>
