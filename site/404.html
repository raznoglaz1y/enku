/* Phosphor Icons */
.icon,
.line-icon,
.github-icon,
.step-icon {
  font-family: inherit;
}
.icon i,
.line-icon i,
.github-icon i,
.step-icon i,
.footer-github i {
  display: inline-block;
  line-height: 1;
  vertical-align: middle;
}
.icon i { font-size: 30px; }
.line-icon i { font-size: 29px; }
.github-icon i { font-size: 26px; }
.footer-github { display:inline-flex; align-items:center; gap:7px; }
.footer-github i { font-size:18px; }

.steps article{
  display:grid;
  grid-template-columns:42px 1fr;
  column-gap:14px;
  align-items:start;
}
.steps .step-icon{
  font-size:30px;
  line-height:1;
  padding-top:2px;
}
.steps article > div small{
  font-size:10px;
  color:#77726b;
}
.steps article > div h3{
  margin-top:8px;
}
.steps article:before{
  left:56px;
}
@media(max-width:760px){
  .steps article{
    grid-template-columns:42px 1fr;
  }
  .steps article > div{
    min-width:0;
  }
}


/* Hero cutout variant */
.hero-visual{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:520px;
}
.hero-visual img{
  width:min(100%, 560px);
  filter: drop-shadow(0 28px 42px rgba(0,0,0,.12));
}
@media(max-width:760px){
  .hero-visual{
    min-height:auto;
    padding-top:12px;
  }
  .hero-visual img{
    width:min(100%, 360px);
  }
}

/* Final approved ENKU hero render */
.hero-visual img{
  width:min(100%, 520px);
  height:auto;
  aspect-ratio:auto;
  object-fit:contain;
  object-position:center;
  mix-blend-mode:normal;
  filter:drop-shadow(0 26px 40px rgba(0,0,0,.10));
}
@media(max-width:760px){
  .hero-visual img{
    width:min(88vw, 340px);
  }
}



/* Stronger volume for approved hero device */
.hero-visual{
  position: relative;
}
.hero-visual::before{
  content: "";
  position: absolute;
  width: min(72%, 360px);
  height: 56px;
  left: 50%;
  bottom: 4%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(ellipse at center,
    rgba(0,0,0,.20) 0%,
    rgba(0,0,0,.11) 38%,
    rgba(0,0,0,.04) 65%,
    rgba(0,0,0,0) 100%);
  filter: blur(10px);
  z-index: 0;
}
.hero-visual img{
  position: relative;
  z-index: 1;
  filter:
    drop-shadow(0 10px 12px rgba(0,0,0,.08))
    drop-shadow(0 28px 34px rgba(0,0,0,.12))
    drop-shadow(0 48px 60px rgba(0,0,0,.08));
}
@media(max-width:760px){
  .hero-visual::before{
    width: min(66%, 220px);
    height: 36px;
    bottom: 2%;
    filter: blur(8px);
  }
  .hero-visual img{
    filter:
      drop-shadow(0 8px 10px rgba(0,0,0,.07))
      drop-shadow(0 22px 24px rgba(0,0,0,.11))
      drop-shadow(0 34px 40px rgba(0,0,0,.07));
  }
}
